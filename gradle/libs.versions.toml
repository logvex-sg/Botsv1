[versions]
mod-version = "6.0.0"

# Fabric (https://fabricmc.net/develop)
# `java` is the language level the mod is compiled against and declares in fabric.mod.json.
# Minecraft 1.21.11 (and Meteor 1.21.11-SNAPSHOT) run on Java 21, so the mod targets 21. The
# build itself runs on any JDK 21+ (CI uses 25); the produced bytecode is identical either way.
java = "21"
minecraft = "1.21.11"
fabric-loader = "0.20.1"
fabric-api = "0.141.6+1.21.11"

# Loom (https://github.com/FabricMC/fabric-loom)
loom = "1.18-SNAPSHOT"

# Meteor (https://github.com/MeteorDevelopment/meteor-client/)
meteor = "1.21.11-SNAPSHOT"

# Testing
junit = "5.10.2"

[libraries]
# Fabric base
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }

# Meteor client
meteor-client = { module = "meteordevelopment:meteor-client", version.ref = "meteor" }

# Testing
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.10.2" }

[plugins]
fabric-loom = { id = "fabric-loom", version.ref = "loom" }
